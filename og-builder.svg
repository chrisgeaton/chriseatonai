<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" font-family="'IBM Plex Sans', -apple-system, system-ui, sans-serif">
  <defs>
    <style>
      .bg { fill: #1a1814; }
      .label { font-family: 'IBM Plex Mono', 'SF Mono', monospace; font-size: 18px; fill: #e8a735; letter-spacing: 0.08em; font-weight: 500; }
      .quote { font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif; font-size: 32px; fill: #a39e93; font-weight: 400; letter-spacing: -0.01em; }
      .decode { font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif; font-size: 38px; fill: #ede9e1; font-weight: 600; letter-spacing: -0.02em; }
      .punch { font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif; font-size: 48px; fill: #e8a735; font-weight: 600; letter-spacing: -0.02em; }
      .url { font-family: 'IBM Plex Mono', 'SF Mono', monospace; font-size: 16px; fill: #706b62; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1200" height="627"/>

  <!-- Accent rule -->
  <rect x="72" y="88" width="44" height="3" fill="#e8a735"/>

  <!-- Label -->
  <text class="label" x="72" y="136">THE BUILDER</text>

  <!-- Guide setup -->
  <text class="quote" x="72" y="188">When I was a fly fishing guide, I didn't make the</text>
  <text class="quote" x="72" y="232">casts. I read the water, put people on the right</text>
  <text class="quote" x="72" y="276">stretch of river, and handed over the rod.</text>

  <!-- Bridge -->
  <text class="decode" x="72" y="348">AI puts a rod in everyone's hands.</text>
  <text class="decode" x="72" y="398">A cast is a working POC.</text>

  <!-- Punchline -->
  <text class="punch" x="72" y="476">Product knows the river.</text>
  <text class="punch" x="72" y="536">Now anyone can cast.</text>

  <!-- Footer -->
  <text class="url" x="72" y="588">Chris Eaton  &#183;  chriseatonai.com</text>
</svg>
